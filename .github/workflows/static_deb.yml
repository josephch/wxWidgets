name: Build wxWidgets Static DEB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0
        with:
            submodules: 'true'

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            dpkg-dev \
            libgtk-3-dev

      - name: Configure
        run: |
          mkdir build-static
          cd build-static

          ../configure \
            --prefix=/usr \
            --disable-shared \
            --disable-sys-libs \
            --with-gtk=3 \
            --enable-secretstore=no

      - name: Build
        run: |
          cd build-static
          make -j$(nproc)

      - name: Install into package root
        run: |
          cd build-static
          make DESTDIR=${GITHUB_WORKSPACE}/pkgroot install

      - name: Create control file
        run: |
          mkdir -p pkgroot/DEBIAN

          VERSION="3.2.10"

          cat > pkgroot/DEBIAN/control <<EOF
          Package: wxwidgets-static
          Version: ${VERSION}
          Section: libdevel
          Priority: optional
          Architecture: amd64
          Maintainer: GitHub Actions
          Description: wxWidgets static libraries
           Static wxWidgets build.
          EOF

      - name: Build DEB
        run: |
          VERSION="3.2.10"

          dpkg-deb --build \
            pkgroot \
            wxwidgets-static-${VERSION}-amd64.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wxwidgets-static-deb
          path: "*.deb"
